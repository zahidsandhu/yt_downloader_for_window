<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; font: 14px "Segoe UI", Arial, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 8px; border: 1px solid #334155; background: #0b1220; color: #e2e8f0; margin-bottom: 8px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #ef4444; color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { background: #dc2626; }
  #st { margin-top: 10px; font-size: 12px; color: #94a3b8; }
  .ok { color: #4ade80 !important; } .bad { color: #f87171 !important; }
</style>
</head>
<body>
  <h1>▶ Video Downloader</h1>
  <input id="url" placeholder="Video ya playlist ka link paste karein">
  <button id="go">App me kholein</button>
  <div id="st">Check ho raha hai...</div>
  <script src="popup.js"></script>

</html>
